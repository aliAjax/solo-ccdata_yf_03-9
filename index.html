<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声线 · 发音练习</title><style>
:root{--bg:#f6f5f1;--ink:#1c2522;--muted:#77817c;--line:#dfe3dd;--green:#16866d;--mint:#d8f1e6;--red:#dd6257}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{max-width:1200px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-size:20px}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}button,input{font:inherit}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 13px;color:var(--ink);cursor:pointer}button:hover{border-color:var(--green);color:var(--green)}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:700}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px}.phrase{padding:13px;border-radius:10px;margin:6px 0;cursor:pointer}.phrase.active{background:var(--mint);color:#0f6d58}.phrase small{display:block;color:var(--muted);margin-top:4px}.tag{font-size:11px;border-radius:99px;padding:3px 7px;background:#eef1ed;color:var(--muted);margin-right:4px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{font-size:12px;padding:6px 8px}.filters button.active{background:var(--ink);color:#fff}.content{min-width:0}.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:27px}.crumb{color:var(--muted);font-size:12px;margin-bottom:18px}.hero h2{font-size:38px;letter-spacing:-.03em;margin:0 0 8px}.translation{color:var(--muted);font-size:16px}.chips{margin:17px 0}.practice{margin-top:18px;border-top:1px solid var(--line);padding-top:20px}.wave{height:100px;border-radius:9px;background:#f5f9f6;border:1px solid #e0ece6;display:flex;align-items:center;justify-content:center;gap:4px;padding:15px}.bar{width:4px;background:var(--green);border-radius:4px;opacity:.75}.controls{display:flex;gap:9px;align-items:center;margin-top:14px}.record{background:#fff0ed;color:var(--red);border-color:#f3c8c2}.recording{background:var(--red);color:#fff;border-color:var(--red)}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px}.stat{background:#f8faf8;border:1px solid var(--line);padding:12px;border-radius:9px}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat b{font-size:18px}.notes{margin-top:18px}.notes textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;min-height:72px}.status{color:var(--green);font-size:12px;min-height:18px;margin-top:10px}@media(max-width:750px){.app{padding:15px}.layout{grid-template-columns:1fr}.hero h2{font-size:30px}.meta{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">◌</div><div><h1>声线</h1><small>把每句话说得更自然</small></div></div><button id="save">保存练习</button></header><section class="layout"><aside class="panel"><h3>我的短句 <span id="count">4</span></h3><input id="search" class="search" placeholder="搜索句子或标签…"><div id="list"></div><div class="divider" style="border-top:1px solid var(--line);margin:18px 0"></div><h3>难度筛选</h3><div class="filters"><button class="active" data-level="all">全部</button><button data-level="入门">入门</button><button data-level="进阶">进阶</button></div></aside><section class="content"><div class="hero"><div class="crumb">练习库 / 日常会话</div><h2 id="title">Could you say that again?</h2><div class="translation">你可以再说一遍吗？</div><div class="chips"><span class="tag">旅行</span><span class="tag">礼貌表达</span><span class="tag">进阶</span></div><div class="practice"><h3>跟读练习</h3><div class="wave" id="wave"></div><div class="controls"><button id="play" class="primary">▶ 播放示范</button><button id="record" class="record">● 开始录音</button><span style="color:var(--muted);font-size:12px" id="time">00:00</span><button id="again">↻ 再练一次</button></div><div class="status" id="status"></div></div><div class="meta"><div class="stat"><small>本句练习</small><b id="attempts">3 次</b></div><div class="stat"><small>最佳评分</small><b>86 / 100</b></div><div class="stat"><small>掌握度</small><b style="color:var(--green)">良好</b></div></div><div class="notes"><h3>练习笔记</h3><textarea id="notes" placeholder="记录发音难点或新的例句…"></textarea></div></div></section></section></main><script>
const data=[{t:'Could you say that again?',cn:'你可以再说一遍吗？',l:'进阶',tags:['旅行','礼貌表达']},{t:'I’ll have the same, please.',cn:'请给我来一份一样的。',l:'入门',tags:['点餐']},{t:'Where is the nearest station?',cn:'最近的车站在哪里？',l:'入门',tags:['问路']},{t:'That sounds like a great idea.',cn:'听起来是个很棒的主意。',l:'进阶',tags:['日常'] }];let active=0,level='all',recording=false,start=0,timer;const list=document.querySelector('#list');function render(){let q=document.querySelector('#search').value.toLowerCase();list.innerHTML='';data.forEach((x,i)=>{if((level!=='all'&&x.l!==level)||!(x.t+x.tags.join()).toLowerCase().includes(q))return;let d=document.createElement('div');d.className='phrase '+(i===active?'active':'');d.innerHTML=x.t+'<small>'+x.l+' · '+x.tags.join(' / ')+'</small>';d.onclick=()=>{active=i;load()};list.append(d)});document.querySelector('#count').textContent=data.length}function load(){let x=data[active];document.querySelector('#title').textContent=x.t;document.querySelector('.translation').textContent=x.cn;document.querySelector('.chips').innerHTML=x.tags.map(t=>`<span class="tag">${t}</span>`).join('')+`<span class="tag">${x.l}</span>`;render();drawWave();document.querySelector('#status').textContent=''}function drawWave(){let w=document.querySelector('#wave');w.innerHTML=Array.from({length:62},(_,i)=>`<i class="bar" style="height:${12+Math.abs(Math.sin(i*.62))*54}px"></i>`).join('')}document.querySelector('#search').oninput=render;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelector('#play').onclick=()=>{document.querySelector('#status').textContent='正在播放示范音频…';setTimeout(()=>document.querySelector('#status').textContent='示范播放完成',1500)};document.querySelector('#record').onclick=()=>{recording=!recording;let b=document.querySelector('#record');b.classList.toggle('recording',recording);b.textContent=recording?'■ 停止录音':'● 开始录音';if(recording){start=Date.now();timer=setInterval(()=>document.querySelector('#time').textContent='00:'+String(Math.floor((Date.now()-start)/1000)).padStart(2,'0'),200)}else{clearInterval(timer);document.querySelector('#status').textContent='录音已保存，可以回放';document.querySelector('#play').textContent='▶ 回放我的录音'}};document.querySelector('#again').onclick=()=>{document.querySelector('#attempts').textContent=(4+Math.floor(Math.random()*2))+' 次';document.querySelector('#status').textContent='已开始新一轮练习'};document.querySelector('#save').onclick=()=>{localStorage.voiceNotes=document.querySelector('#notes').value;document.querySelector('#status').textContent='笔记已保存在本地'};document.querySelector('#notes').value=localStorage.voiceNotes||'';load();
</script></body></html>
